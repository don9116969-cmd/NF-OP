name: Nifty Intraday Trading Bot

on:
  schedule:
    # 03:44 UTC is 09:14 AM Indian Standard Time (IST) - Pre-market startup
    # 09:14 AM IST allows runner 1 min to boot and standby for 09:15 AM market opening bell
    - cron: '44 3 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab OR automated HTTP webhook call

concurrency:
  group: nifty-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Full trading day coverage (09:14 AM to 15:06 PM IST, safe within GitHub 360-min cap)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline regression checks
        run: python -m unittest discover -s tests

      - name: Run Nifty Trading Bot
        env:
          TZ: 'Asia/Kolkata'
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD || secrets.ANGEI_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Nifty Bot Cloud Runner"
          git config --global user.email "bot@github-actions.internal"
          python -u live_paper_trader.py --strategy all

      - name: Commit and Push Journal Updates
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Nifty Bot Cloud Runner"
          git config --global user.email "bot@github-actions.internal"
          git add data/trade_journal.md data/trade_journal.csv data/active_positions.json data/sent_alerts.json data/audited_days.json data/nifty_1min_real.csv data/banknifty_1min_real.csv
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update trade journal and market candles [skip ci]"
          fi
          if [ "$(git rev-list --count origin/main..HEAD)" -gt 0 ]; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
