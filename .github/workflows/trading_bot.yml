name: Nifty Intraday Trading Bot

on:
  schedule:
    # 03:50 UTC is 09:20 AM Indian Standard Time (IST)
    # Runs Monday to Friday
    - cron: '50 3 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours execution limit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty Trading Bot
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD || secrets.ANGEI_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u live_paper_trader.py --strategy all

      - name: Commit and Push Journal Updates
        run: |
          git config --global user.name "Nifty Bot Cloud Runner"
          git config --global user.email "bot@github-actions.internal"
          git add data/trade_journal.md data/trade_journal.csv data/live_paper_trades.csv || true
          if git diff --staged --quiet; then
            echo "No journal changes to commit."
          else
            git commit -m "Auto-update trade journal [skip ci]"
            git push
          fi
