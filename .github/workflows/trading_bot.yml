name: Nifty Intraday Trading Bot

on:
  schedule:
    # 03:42 UTC is 09:12 AM Indian Standard Time (IST) - Pre-market startup
    # 09:12 AM IST allows runner 3 mins to boot and standby for 09:15 AM market opening bell
    # Note: 42 minute avoids standard :00, :15, :30, :45, :50 GitHub Actions queue congestion
    - cron: '42 3 * * 1-5'
    # 03:48 UTC is 09:18 AM Indian Standard Time (IST) - Backup trigger in case primary was queued
    - cron: '48 3 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab OR automated HTTP webhook call

concurrency:
  group: nifty-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 380 # Full trading day coverage (09:12 AM to 15:30 PM IST)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Nifty Trading Bot
        env:
          TZ: 'Asia/Kolkata'
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD || secrets.ANGEI_PASSWORD }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Nifty Bot Cloud Runner"
          git config --global user.email "bot@github-actions.internal"
          python -u live_paper_trader.py --strategy all

      - name: Commit and Push Journal Updates
        if: always()
        run: |
          git config --global user.name "Nifty Bot Cloud Runner"
          git config --global user.email "bot@github-actions.internal"
          git add data/trade_journal.md data/trade_journal.csv data/live_paper_trades.csv data/active_positions.json data/audited_days.json data/paper_trading_ledger.csv || true
          if git diff --staged --quiet; then
            echo "No journal changes to commit."
          else
            git commit -m "Auto-update trade journal [skip ci]"
            git push
          fi
